<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contactcss.css">
    <title>contactus</title>
</head>
<body class="all">

    <!-- header -->
    <header class="header">
        <div class=><a href="../home/interface/interface.html"><img class="logo" src="../home/pictures/logo.png" ></a></div>
    

        <!-- nav bar -->
        <nav class="nav">
            <ul>
                <li><a href="../home/interface/interface.html" id="nv" class="underline">Home</a></li>
                <li><a href="../aboutus/aboutus.html" id="nv" class="underline">About Us</a></li>
            </ul>
        </nav>
    </header>

    <section class="section">

        <!-- double text div -->
<div class="cnhv">
    <div class="cnd">
        <span id="cn">Contact Us!!</span>
    </div>
    <div class="hvd">
        <span id="hv">Have questions? The quickest way to get in touch with us <br>is using the contact information below.</span>
    </div>
</div>

<!-- contact form -->
<div class="contact-form">
    <form>
        <br>
        <div class="form-group">
            <label>Full Name :</label>
         <input type="text" name="name" placeholder="Enter Your Name">    
        </div>
        <div class="form-group">
         <label>Email :</label>
         <input type="email" name="Email" placeholder="Enter Your Email" >
        </div>
        <div class="form-group">
            <label>Phone Number :</label>
            <input type="tel" name="Phone number" placeholder="Enter Your Phone Number" >
           </div>
        <div class="form-group">
            <label>Message :</label>
        <textarea name="message" placeholder="Enter Your Message"></textarea>
        </div>
        <div class="form-group">
         <button type="reset">Send message</button> 
        </div>
    </form>
</div>



    </section>


    <!-- footer -->
    <footer class="footer">
        <div class="discover">
            <p>Discover Us In</p>
        </div>
        <div class="social-icons">
           
            <a href="#" class="icon"><img src="../home/icons/fb.png" alt="Facebook"></a>
            <a href="#" class="icon"><img src="../home/icons/tw.png" alt="Twitter"></a>
            <a href="#" class="icon"><img src="../home/icons/ln.png" alt="LinkedIn"></a>
            <a href="#" class="icon"><img src="../home/icons/ig.png" alt="Instagram"></a>

        </div>
        <div class="copyright">
            <p>&copy; 2023 TECHPLANET.  All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
